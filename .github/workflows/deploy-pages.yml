name: Deploy 바다꼼꼬미 PWA to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  workflow_run:
    workflows: ['Collect KHOA navigational warnings (artifact only)']
    types: [completed]
    branches: ['main']
  schedule:
    # 19:17 UTC on the previous day = 04:17 KST. Scheduling may be delayed.
    - cron: '17 19 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # One path for push, schedule and manual refresh. Never deploy arbitrary refs.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')))
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Record checked-out source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Find last successfully deployed tide backup
        id: backup
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // Bound history scanning; expiry/deletion falls back to the published JSON.
            for (let page = 1; page <= 3; page++) {
              const { data } = await github.rest.actions.listArtifactsForRepo({...context.repo, per_page: 100, page});
              for (const artifact of data.artifacts) {
                if (artifact.expired || !/^khoa-tides-\d+-\d+$/.test(artifact.name) || artifact.workflow_run?.head_branch !== 'main') continue;
                const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: artifact.workflow_run.id});
                if (run.conclusion !== 'success' || run.path !== '.github/workflows/deploy-pages.yml' || run.event === 'pull_request') continue;
                core.setOutput('id', String(artifact.id));
                core.setOutput('run', String(run.id));
                return;
              }
              if (data.artifacts.length < 100) break;
            }

      - name: Download verified backup
        if: steps.backup.outputs.id != ''
        # Deleted/expired between discovery and download: published JSON is the fallback.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.backup.outputs.id }}
          run-id: ${{ steps.backup.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/khoa-recovery
          merge-multiple: true

      - name: Recover verified tide snapshot
        id: recovery
        env:
          KHOA_RECOVERY_FILE: ${{ runner.temp }}/khoa-recovery/latest.json
          KHOA_PAGES_URL: ${{ steps.pages.outputs.base_url }}/data/tides/latest.json
        run: node scripts/prepare-khoa-tides.mjs

      - name: Collect 32 days of KHOA forecasts
        # First push needs bootstrap; subsequent pushes inherit the last good data.
        if: github.event_name != 'workflow_run' && (github.event_name != 'push' || steps.recovery.outputs.restored != 'true')
        env:
          KHOA_SERVICE_KEY: ${{ secrets.KHOA_SERVICE_KEY }}
        run: node scripts/update-khoa-tides.mjs

      - name: Require validated tide data before any deployment
        run: node --input-type=module -e "import {readSnapshot,OUTPUT} from './scripts/update-khoa-tides.mjs'; if (!await readSnapshot(OUTPUT)) { console.error('Missing verified tide snapshot. Deployment blocked.'); process.exit(1); }"

      - name: Find trusted navigational warning artifact
        id: navigation
        uses: actions/github-script@v7
        with:
          script: |
            const workflowPath = '.github/workflows/collect-navigational-warnings.yml';
            const allowed = run => run.path === workflowPath && run.head_branch === 'main' &&
              run.status === 'completed' && ['schedule', 'workflow_dispatch'].includes(run.event);
            const output = (artifact, run, attempt) => {
              core.setOutput('id', String(artifact.id));
              core.setOutput('run', String(run.id));
              core.setOutput('attempt', String(attempt));
            };
            if (context.eventName === 'workflow_run') {
              const eventRun = context.payload.workflow_run;
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: eventRun.id});
              if (!allowed(run) || eventRun.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                core.setFailed('Untrusted collection event. No deployment.'); return;
              }
              if (run.run_attempt !== eventRun.run_attempt) { core.setFailed('Superseded collection attempt. No deployment.'); return; }
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: run.id, per_page: 100});
              const artifact = data.artifacts.find(a => !a.expired && a.name === `khoa-navigation-${run.id}-${eventRun.run_attempt}`);
              if (artifact) output(artifact, run, eventRun.run_attempt);
              return;
            }
            // First deployment may have no collector history yet. Published Pages is
            // the recovery baseline; an API/search error never replaces it with zeros.
            for (let page = 1; page <= 3; page++) {
              const {data} = await github.rest.actions.listArtifactsForRepo({...context.repo, per_page: 100, page});
              for (const a of data.artifacts) {
                const match = /^khoa-navigation-(\d+)-(\d+)$/.exec(a.name);
                if (a.expired || !match || a.workflow_run?.head_branch !== 'main' || a.workflow_run.id !== Number(match[1])) continue;
                const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(match[1])});
                if (allowed(run) && run.run_attempt === Number(match[2])) { output(a, run, Number(match[2])); return; }
              }
              if (data.artifacts.length < 100) break;
            }

      - name: Download navigational warning JSON
        if: steps.navigation.outputs.id != ''
        # Deleted/expired between discovery and download: use the published baseline.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.navigation.outputs.id }}
          run-id: ${{ steps.navigation.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/navigation-publication
          merge-multiple: true

      - name: Validate repository source before preparing runtime warning data
        run: |
          npm run lint
          npm test

      - name: Prepare complete warning data with published fallback
        env:
          NAV_WARNING_ARTIFACT_DIR: ${{ runner.temp }}/navigation-publication
          NAV_WARNING_PAGES_URL: ${{ steps.pages.outputs.base_url }}
          NAV_WARNING_SOURCE_RUN_ID: ${{ steps.navigation.outputs.run }}
          NAV_WARNING_SOURCE_RUN_ATTEMPT: ${{ steps.navigation.outputs.attempt }}
          NAV_WARNING_REQUIRE_ARTIFACT: ${{ github.event_name == 'workflow_run' || steps.navigation.outputs.id != '' }}
        run: |
          # Bootstrap without a collector history is allowed on an initial push.
          # A collection-triggered publication must validate its actual artifact.
          node --input-type=module <<'NODE'
          import {readWarningArtifact} from './scripts/prepare-navigational-warnings.mjs';
          if (process.env.NAV_WARNING_REQUIRE_ARTIFACT === 'true') {
            const pair = await readWarningArtifact(process.env.NAV_WARNING_ARTIFACT_DIR);
            if (!pair) {
              console.error('::error::Selected collection artifact is missing or invalid. Existing Pages data is preserved.');
              process.exitCode = 1;
            } else if (!['success', 'failed'].includes(pair.status.status)) {
              console.error('::error::Selected artifact contains no collection attempt. Check KHOA_NAV_WARNING_SERVICE_KEY. Existing Pages data is preserved.');
              process.exitCode = 1;
            }
          }
          NODE
          node scripts/prepare-navigational-warnings.mjs

      - name: Production Build & Post-Build SW Integrity Check
        env:
          GITHUB_ACTIONS: 'true'
          VITE_BASE_PATH: ${{ format('{0}/', steps.pages.outputs.base_path) }}
          KAKAO_MAP_API_KEY: ${{ secrets.KAKAO_MAP_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          npm run build
          npm run verify
          node scripts/verify-navigational-warning-preview.mjs

      - name: Reject superseded source revision
        uses: actions/github-script@v7
        env:
          CHECKED_OUT_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (data.commit.sha !== process.env.CHECKED_OUT_SHA) core.setFailed('main advanced during this run. Re-run the latest main revision; no deployment was started.');

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record actual deployment outcome
        run: echo 'Pages deployment completed. Navigational warning publication metadata records preparation; this step confirms deployment success.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve successfully deployed tide snapshot
        uses: actions/upload-artifact@v4
        with:
          name: khoa-tides-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/data/tides/latest.json
          if-no-files-found: error
          retention-days: 90
